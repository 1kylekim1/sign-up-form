<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div id="background-image">
            <div id="logo-background">
                <img src="./images/odin-lined.png">
                <h1 id="company-name">ODIN</h1>
            </div>
            <p id="photo-credit">Photo by <u><a href="https://unsplash.com/@albert_canite" target="_blank">Albert Canite</a></u> on <u><a href="https://unsplash.com/" target="_blank">Unsplash</a></u></p>
        </div>
        <div id="sign-up-section">
            <div id="sign-up-message">
                <h1>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</h1>
                <h1>Sign up <em>now</em> to get started.</h1>
                <br>
                <h1>You <em>know</em> you want to.</h1>
            </div>
            <div id="sign-up-form">
                <h1>Let's do this!</h1>
                <form id="registration-form">
                    <div class="form-row">
                        <div class="input-container">
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" id="first_name" name="first_name" required>
                        </div>
                        <div class="input-container">
                            <label for="last_name">LAST NAME</label>
                            <input type="text" id="last_name" name="last_name" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-container">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="input-container">
                            <label for="phone_number">PHONE NUMBER</label>
                            <input type="tel" id="phone_number" name="phone_number" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="input-container">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password" required minlength="8">
                        </div>
                        <div class="input-container">
                            <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
                        </div>
                    </div>
                </form>
            </div>
            <div id="sign-up-create-account">
                <button type="submit" form="registration-form">Create Account</button>
                <p>Already have an account? <a href="" id="log_in">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
